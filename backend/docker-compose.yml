version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teletime
      POSTGRES_PASSWORD: teletime
      POSTGRES_DB: teletime
    ports:
      - "5432:5432"
    volumes:
      - teletime_pgdata:/var/lib/postgresql/data

volumes:
  teletime_pgdata:
